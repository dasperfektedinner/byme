<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Terminvorschlag</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&family=Dancing+Script:wght@500&display=swap" rel="stylesheet">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: 'Lato', Arial, sans-serif;
    background: linear-gradient(180deg, #000000, #0b1a2a, #1f2f4a);
    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.container {
    background: radial-gradient(circle at center, rgba(255,255,255,0.08), rgba(0,0,30,0.9));
    padding: 50px 55px;
    border-radius: 25px;
    text-align: center; 
    box-shadow: 0 30px 70px rgba(0,0,0,0.7);
    max-width: 520px;
    width: 90%;
    position: relative;
}

.logo {
    width: 120px;
    display: block;
    margin: 0 auto 25px auto;
    animation: pulse 2.5s infinite alternate;
}

@keyframes pulse {
    0% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(255,255,255,0.3)); }
    50% { transform: scale(1.05); filter: drop-shadow(0 0 15px rgba(255,255,255,0.5)); }
    100% { transform: scale(1.02); filter: drop-shadow(0 0 8px rgba(255,255,255,0.4)); }
}

h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.2em; 
    margin-bottom: 25px;
}

.invite-text {
    font-family: 'Dancing Script', cursive;
    font-size: 1.4em;
    margin: 12px 0;
}

.termin-daten {
    font-family: 'Playfair Display', serif;
    font-size: 1.15em;
    margin: 8px 0;
}

.divider {
    height: 1px;
    background: rgba(255,255,255,0.25);
    margin: 20px 0;
}

.btn {
    margin-top: 15px;
    padding: 14px 30px;
    font-size: 1em;
    font-weight: 600;
    border-radius: 30px;
    background: linear-gradient(180deg, #ffffff, #dddddd);
    color: #000;
    text-decoration: none;
    display: inline-block;
    min-width: 230px;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.05);
}

.green {
    background: linear-gradient(180deg, #4caf50, #2e7d32);
    color: white;
}

.back-btn {
    position: absolute;
    top: 10px;
    left: 10px;
    cursor: pointer;
    text-decoration: underline;
}

.page {
    opacity: 0;
    transform: scale(0.95);
    transition: 0.5s;
    display: none;
}

.page.active {
    display: block;
    opacity: 1;
    transform: scale(1);
}
</style>
</head>

<body>

<div class="container">

    <div class="page active" id="page1">
        <img src="logo.png" class="logo">
        <h1>Terminvorschlag</h1>
        <button class="btn" onclick="showDetails()">Anzeigen</button>
    </div>

    <div class="page" id="page2">
        <img src="logo.png" class="logo">

        <p class="invite-text">Hiermit lade ich dich herzlich zu meinem „Perfekten Dinner“ ein.</p>

        <div class="divider"></div>

        <p class="termin-daten">Am: 21.02.2026</p>
        <p class="termin-daten">Wo: Thiedeweg 23b</p>
        <p class="termin-daten">Wann: 18 Uhr</p>
        <p class="termin-daten">Dresscode: Locker und gemütlich</p>

        <div class="divider"></div>

        <a class="btn green"
           href="sms:+4915209767662?body=Ich%20nehme%20am%20Perfekten%20Dinner%20teil!">
           Termin bestätigen
        </a>

        <a class="btn" href="Speisekarte.pdf" download>
            Speisekarte herunterladen
        </a>

        <a class="btn" href="Getraenkekarte.pdf" download>
            Getränkekarte herunterladen
        </a>

        <div class="back-btn" onclick="goBack()">Zurück</div>
    </div>
</div>

<script>
function showDetails() {
    page1.classList.remove("active");
    setTimeout(() => {
        page1.style.display = "none";
        page2.style.display = "block";
        page2.classList.add("active");
    }, 200);
}

function goBack() {
    page2.classList.remove("active");
    setTimeout(() => {
        page2.style.display = "none";
        page1.style.display = "block";
        page1.classList.add("active");
    }, 200);
}
</script>

</body>
</html>
