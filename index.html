<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Perfektes Dinner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&family=Dancing+Script:wght@500&display=swap" rel="stylesheet">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: 'Lato', Arial, sans-serif;
    background: linear-gradient(180deg, #000000, #0b1a2a, #1f2f4a);
    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.container {
    background: radial-gradient(circle at center, rgba(255,255,255,0.08), rgba(0,0,30,0.9));
    padding: 25px 55px 50px;
    border-radius: 25px;
    text-align: center; 
    box-shadow: 0 30px 70px rgba(0,0,0,0.7);
    max-width: 520px;
    width: 90%;
    position: relative;
}

.logo {
    width: 115px;
    margin: 20px auto 5px;
}

.btn {
    margin-top: 12px;
    padding: 12px 26px;
    font-size: 0.95em;
    border-radius: 30px;
    background: linear-gradient(180deg, #ffffff, #dddddd);
    color: #000;
    text-decoration: none;
    display: inline-block;
    min-width: 210px;
    transition: 0.3s;
    border: none;
    cursor: pointer;
}
.green { background: linear-gradient(180deg, #4caf50, #2e7d32); color: white; }

.page { opacity: 0; transform: scale(0.95); transition: 0.5s; display: none; }
.page.active { display: block; opacity: 1; transform: scale(1); }

/* KONFETTI */
.confetti {
    position: fixed;
    top: -10px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    animation: fall linear forwards;
}

/* ULTRA FUNKEL FUNKEN */
.spark {
    position: fixed;
    top: -10px;
    width: 1.5px;
    height: 1.5px;
    border-radius: 50%;
    background: white;
    box-shadow:
        0 0 6px 2px #ffffff,
        0 0 14px 6px #ffeb3b,
        0 0 25px 10px #ff9800,
        0 0 40px 16px #fff3e0;
    animation:
        sparkFall linear forwards,
        sparkFlicker 0.08s infinite alternate;
}

@keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
}
@keyframes sparkFall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}
@keyframes sparkFlicker {
    0% { opacity: 0.1; }
    50% { opacity: 1; }
    100% { opacity: 0.2; }
}
</style>
</head>

<body>

<div class="container">
<div class="page active" id="page1">
    <img src="logo.png" class="logo">
    <h1>Terminvorschlag</h1>
    <button class="btn" onclick="showDetails()">Anzeigen</button>
</div>

<div class="page" id="page2">
    <img src="logo.png" class="logo">
    <p>Am: 21.02.2026 – 18 Uhr</p>
    <a class="btn green" onclick="confirmDinner()">Termin bestätigen</a>
</div>
</div>

<script>
const page1 = document.getElementById("page1");
const page2 = document.getElementById("page2");

function showDetails() {
    page1.classList.remove("active");
    setTimeout(() => {
        page1.style.display = "none";
        page2.style.display = "block";
        page2.classList.add("active");
    }, 200);
}

/* EXTREMER FUNKENREGEN */
let confettiInterval;
function startConfetti() {
    confettiInterval = setInterval(() => {
        for(let i=0;i<120;i++){ // ÜBERTRIEBEN VIEL 😈
            let s = document.createElement("div");
            s.className = "spark";
            s.style.left = Math.random()*100 + "vw";
            s.style.animationDuration = (0.6 + Math.random()*0.8) + "s";
            document.body.appendChild(s);
            setTimeout(()=>s.remove(),2500);
        }
    }, 60);
}

function confirmDinner() {
    startConfetti();
    setTimeout(()=>{
        clearInterval(confettiInterval);
    }, 3000);
}
</script>

</body>
</html>
