<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Perfektes Dinner</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        height: 100vh;
        background: url("background.jpg") no-repeat center center/cover;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
    }

    .page {
        display: none;
        text-align: center;
        width: 100%;
        max-width: 400px;
    }

    .active {
        display: block;
    }

    img.logo {
        width: 150px;
        margin-bottom: 30px;
        animation: pulse 3s infinite;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }

    h1 {
        margin-bottom: 20px;
    }

    button {
        padding: 12px 25px;
        border-radius: 25px;
        border: none;
        font-size: 16px;
        cursor: pointer;
        margin: 10px;
    }

    .btn-grey {
        background: #bcbcbc;
        color: black;
    }

    .btn-green {
        background: #1f6b3a;
        color: white;
    }

    .divider {
        width: 80%;
        height: 1px;
        background: white;
        margin: 20px auto;
    }

    .fancy {
        font-family: "Comic Sans MS", "Segoe Script", cursive;
        font-size: 20px;
        margin-bottom: 10px;
    }

    .back {
        position: absolute;
        top: 20px;
        left: 20px;
        cursor: pointer;
        text-decoration: underline;
        color: white;
    }
</style>
</head>

<body>

<!-- SEITE 1 -->
<div class="page active" id="page1">
    <img src="logo.png" class="logo">
    <h1>Terminvorschlag</h1>
    <button class="btn-grey" onclick="showPage(2)">Anzeigen</button>
</div>

<!-- SEITE 2 -->
<div class="page" id="page2">
    <div class="back" onclick="showPage(1)">Zurück</div>

    <img src="logo.png" class="logo">

    <div class="fancy">
        Hiermit lade ich dich herzlich zu meinem<br>
        "Perfekten Dinner" ein.
    </div>

    <div class="divider"></div>

    <p>
        Am: 21.02.2026<br>
        Wo: Thiedeweg 23b<br>
        Wann: 18 Uhr<br>
        Dresscode: Locker und gemütlich
    </p>

    <div class="divider"></div>

    <button class="btn-green" onclick="sendSMS()">Termin bestätigen</button><br>

    <button class="btn-grey" onclick="downloadMenu()">Speisekarte herunterladen</button>
</div>

<script>
function showPage(num) {
    document.getElementById("page1").classList.remove("active");
    document.getElementById("page2").classList.remove("active");
    document.getElementById("page" + num).classList.add("active");
}

function sendSMS() {
    window.location.href = "sms:+4915209767662?body=Ich%20best%C3%A4tige%20meinen%20Termin%20f%C3%BCr%20das%20Perfekte%20Dinner!";
}

function downloadMenu() {
    window.location.href = "Speisekarte.pdf";
}
</script>

</body>
</html>
