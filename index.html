<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Terminvorschlag</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&family=Dancing+Script:wght@500&display=swap" rel="stylesheet">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: 'Lato', Arial, sans-serif;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: radial-gradient(circle at center, #05080f, #0b1a2a);
}

body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: url("https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1600&q=80")
        no-repeat center/cover;
    filter: blur(18px) brightness(0.35);
    z-index: -1;
}

.container {
    background: rgba(8, 12, 25, 0.65);
    backdrop-filter: blur(10px);
    padding: 50px 40px;
    border-radius: 28px;
    text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,0.8);
    max-width: 520px;
    width: 90%;
    position: relative;
    overflow: hidden;
}

.logo {
    width: 120px;
    margin-bottom: 25px;
    animation: pulse 2.5s infinite alternate;
}

@keyframes pulse {
    from { transform: scale(1); filter: drop-shadow(0 0 5px rgba(255,255,255,.3)); }
    to   { transform: scale(1.08); filter: drop-shadow(0 0 18px rgba(255,255,255,.5)); }
}

h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.3em;
    margin-bottom: 25px;
}

.invite-text {
    font-family: 'Dancing Script', cursive;
    font-size: 1.45em;
}

.termin-daten {
    font-family: 'Playfair Display', serif;
    margin: 8px 0;
    font-size: 1.1em;
}

.divider {
    height: 1px;
    background: rgba(255,255,255,.25);
    margin: 22px 0;
}

.btn {
    margin-top: 18px;
    padding: 14px 30px;
    border-radius: 30px;
    border: none;
    font-weight: 600;
    cursor: pointer;
    background: linear-gradient(#fff, #ddd);
    transition: .3s;
    text-decoration: none;
    color: #000;
    display: inline-block;
    min-width: 230px;
}

.btn:hover { transform: scale(1.05); }

.green {
    background: linear-gradient(#4caf50, #2e7d32);
    color: #fff;
}

.back-btn {
    position: absolute;
    top: 14px;
    left: 14px;
    cursor: pointer;
    text-decoration: underline;
    opacity: .8;
}

.page {
    position: absolute;
    inset: 0;
    opacity: 0;
    transform: scale(0.97);
    filter: blur(8px);
    transition:
        opacity .9s ease,
        transform .9s cubic-bezier(.25,.8,.25,1),
        filter .9s ease;
    pointer-events: none;
}

.page.active {
    opacity: 1;
    transform: scale(1);
    filter: blur(0);
    pointer-events: auto;
}
</style>
</head>

<body>

<div class="container">

    <div class="page active" id="page1">
        <img src="logo.png" class="logo">
        <h1>Terminvorschlag</h1>
        <button class="btn green" onclick="showDetails()">Anzeigen</button>
    </div>

    <div class="page" id="page2">
        <img src="logo.png" class="logo">
        <p class="invite-text">Hiermit lade ich dich herzlich zu meinem „Perfekten Dinner“ ein.</p>

        <div class="divider"></div>

        <p class="termin-daten">Am: 21.02.2026</p>
        <p class="termin-daten">Wo: Thiedeweg 23b</p>
        <p class="termin-daten">Wann: 18 Uhr</p>
        <p class="termin-daten">Dresscode: Locker und gemütlich</p>

        <div class="divider"></div>

        <a class="btn green" href="sms:+4915209767662?body=Ich%20nehme%20am%20Perfekten%20Dinner%20teil!">
            Termin bestätigen
        </a>

        <a class="btn" href="Speisekarte.pdf" download>
            Speisekarte herunterladen
        </a>

        <div class="back-btn" onclick="goBack()">Zurück</div>
    </div>

</div>

<script>
function showDetails() {
    page2.classList.add("active");
    page1.classList.remove("active");
}

function goBack() {
    page1.classList.add("active");
    page2.classList.remove("active");
}
</script>

</body>
</html>
