<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Perfektes Dinner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&family=Dancing+Script:wght@500&display=swap" rel="stylesheet">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: 'Lato', Arial, sans-serif;
    background: linear-gradient(180deg, #000000, #0b1a2a, #1f2f4a);
    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.container {
    background: radial-gradient(circle at center, rgba(255,255,255,0.08), rgba(0,0,30,0.9));
    padding: 35px 55px 50px;
    border-radius: 25px;
    text-align: center; 
    box-shadow: 0 30px 70px rgba(0,0,0,0.7);
    max-width: 520px;
    width: 90%;
    position: relative;
}

/* Buttons in die Ecken */
.maps-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 5px 10px;
    font-size: 0.75em;
    border-radius: 12px;
    font-weight: bold;
    background: rgba(255,255,255,0.15);
    color: #fff;
    text-decoration: none;
    z-index: 10; /* sicher vor Logo */
    transition: 0.3s;
}
.maps-btn:hover { 
    background: rgba(255,255,255,0.3);
    transform: scale(1.05); 
}

.back-btn {
    position: absolute;
    top: 12px;
    left: 12px;
    font-size: 0.75em;
    cursor: pointer;
    text-decoration: underline;
    z-index: 10;
}

/* Logo */
.logo {
    width: 115px;
    margin: 20px auto 10px; /* weiter oben gesetzt */
    animation: pulse 2.5s infinite alternate;
}

@keyframes pulse {
    0% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(255,255,255,0.3)); }
    50% { transform: scale(1.05); filter: drop-shadow(0 0 15px rgba(255,255,255,0.5)); }
    100% { transform: scale(1.02); filter: drop-shadow(0 0 8px rgba(255,255,255,0.4)); }
}

/* Countdown */
#countdown {
    font-family: monospace;
    font-size: 1.05em;
    letter-spacing: 3px;
    margin-bottom: 5px;
    opacity: 0.85;
}

/* Text */
h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2em;
    margin-bottom: 15px;
}
.invite-text {
    font-family: 'Dancing Script', cursive;
    font-size: 1.3em;
}
.termin-daten {
    font-family: 'Playfair Display', serif;
    font-size: 1.1em;
}

/* Divider */
.divider {
    height: 1px;
    background: rgba(255,255,255,0.25);
    margin: 15px 0;
}

/* Buttons */
.btn {
    margin-top: 12px;
    padding: 12px 26px;
    font-size: 0.95em;
    border-radius: 30px;
    background: linear-gradient(180deg, #ffffff, #dddddd);
    color: #000;
    text-decoration: none;
    display: inline-block;
    min-width: 210px;
    transition: 0.3s;
    border: none;
    cursor: pointer;
}
.btn:hover { transform: scale(1.05); }

.green {
    background: linear-gradient(180deg, #4caf50, #2e7d32);
    color: white;
}

/* Seiten */
.page {
    opacity: 0;
    transform: scale(0.95);
    transition: 0.5s;
    display: none;
}
.page.active {
    display: block;
    opacity: 1;
    transform: scale(1);
}

/* Konfetti & Funken */
.confetti, .spark {
    position: fixed;
    width: 8px;
    height: 8px;
    top: -10px;
    border-radius: 50%;
    animation: fall 2s linear forwards;
}

.spark {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    box-shadow: 0 0 6px 2px yellow;
}

@keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
}
</style>
</head>

<body>

<div class="container">

<!-- SEITE 1 -->
<div class="page active" id="page1">
    <img src="logo.png" class="logo">
    <h1>Terminvorschlag</h1>
    <button class="btn" onclick="showDetails()">Anzeigen</button>
</div>

<!-- SEITE 2 -->
<div class="page" id="page2">

    <a class="btn maps-btn" target="_blank"
       href="https://www.google.com/maps/search/?api=1&query=Thiedeweg+23b,+22047+Hamburg">
       📍 Maps
    </a>

    <div class="back-btn" onclick="goBack()">Zurück</div>

    <img src="logo.png" class="logo">
    <div id="countdown">[ -- : -- : -- ]</div>

    <p class="invite-text">Hiermit lade ich dich herzlich zu meinem „Perfekten Dinner“ ein.</p>

    <div class="divider"></div>

    <p class="termin-daten">Am: 21.02.2026</p>
    <p class="termin-daten">Wo: Thiedeweg 23b</p>
    <p class="termin-daten">Wann: 18 Uhr</p>
    <p class="termin-daten">Dresscode: Locker & gemütlich</p>

    <div class="divider"></div>

    <a class="btn green" onclick="confirmDinner()">Termin bestätigen</a>

    <a class="btn" href="Speisekarte.pdf">🍝 Speise und Getränkekarte</a>

</div>
</div>

<script>
const page1 = document.getElementById("page1");
const page2 = document.getElementById("page2");

/* Seitenwechsel */
function showDetails() {
    page1.classList.remove("active");
    setTimeout(() => {
        page1.style.display = "none";
        page2.style.display = "block";
        page2.classList.add("active");
    }, 200);
}

function goBack() {
    page2.classList.remove("active");
    setTimeout(() => {
        page2.style.display = "none";
        page1.style.display = "block";
        page1.classList.add("active");
    }, 200);
}

/* Konfetti + Funken + SMS */
function confirmDinner() {
    let bursts = 5;     // Wellen
    let pieces = 120;   // Konfetti pro Welle
    for (let b = 0; b < bursts; b++) {
        setTimeout(() => {
            for (let i = 0; i < pieces; i++) {
                // Konfetti
                let c = document.createElement("div");
                c.className = "confetti";
                c.style.left = Math.random()*100+"vw";
                c.style.background = `hsl(${Math.random()*360},100%,50%)`;
                c.style.animationDuration = (1.5+Math.random())+"s";
                document.body.appendChild(c);
                setTimeout(()=>c.remove(),2500);

                // Funken
                if (Math.random() < 0.3) {
                    let f = document.createElement("div");
                    f.className = "spark";
                    f.style.left = Math.random()*100+"vw";
                    f.style.background = "yellow";
                    f.style.animationDuration = (1+Math.random())+"s";
                    document.body.appendChild(f);
                    setTimeout(()=>f.remove(),2000);
                }
            }
        }, b*200);
    }

    setTimeout(()=>{
        window.location.href = "sms:+4915209767662?body=Ich%20nehme%20am%20Perfekten%20Dinner%20teil!";
    }, 2300); // Verzögerung 2,3 Sekunden
}

/* Countdown */
const eventDate = new Date("2026-02-21T18:00:00").getTime();
const cd = document.getElementById("countdown");
setInterval(() => {
    const now = new Date().getTime();
    let diff = eventDate - now;
    if(diff<0) diff=0;
    let h = String(Math.floor(diff / (1000*60*60))).padStart(2,"0");
    let m = String(Math.floor((diff%(1000*60*60))/(1000*60))).padStart(2,"0");
    let s = String(Math.floor((diff%(1000*60))/1000)).padStart(2,"0");
    cd.textContent = `[ ${h} : ${m} : ${s} ]`;
},1000);
</script>

</body>
</html>
