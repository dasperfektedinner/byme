<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfektes Dinner</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden; /* kein Scrollen */
    font-family: Arial, sans-serif;
}

body {
    background: url("background.jpg") no-repeat center center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

.overlay {
    background: rgba(0,0,0,0.45);
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.page {
    display: none;
    text-align: center;
    width: 90%;
    max-width: 420px;
}

.page.active {
    display: block;
}

.logo {
    width: 200px;
    margin-bottom: 30px;
    animation: pulse 3s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }
    100% { transform: scale(1); }
}

h1 {
    font-size: 36px;
    margin-bottom: 25px;
}

.fancy {
    font-family: "Segoe Script", "Comic Sans MS", cursive;
    font-size: 26px;
    line-height: 1.4;
}

p {
    font-size: 22px;
    line-height: 1.6;
}

.divider {
    width: 85%;
    height: 1px;
    background: white;
    margin: 25px auto;
}

button {
    width: 85%;
    max-width: 320px;
    padding: 18px;
    border-radius: 30px;
    border: none;
    font-size: 20px;
    margin: 12px 0;
    cursor: pointer;
}

.btn-grey {
    background: #bcbcbc;
    color: black;
}

.btn-green {
    background: #1f6b3a;
    color: white;
}

.back {
    position: absolute;
    top: 20px;
    left: 20px;
    font-size: 18px;
    text-decoration: underline;
    cursor: pointer;
    color: white;
}
</style>
</head>

<body>
<div class="overlay">

<!-- SEITE 1 -->
<div class="page active" id="page1">
    <img src="logo.png" class="logo">
    <h1>Terminvorschlag</h1>
    <button class="btn-grey" onclick="showPage(2)">Anzeigen</button>
</div>

<!-- SEITE 2 -->
<div class="page" id="page2">
    <div class="back" onclick="showPage(1)">Zurück</div>

    <img src="logo.png" class="logo">

    <div class="fancy">
        Hiermit lade ich dich herzlich zu meinem<br>
        „Perfekten Dinner“ ein.
    </div>

    <div class="divider"></div>

    <p>
        Am: 21.02.2026<br>
        Wo: Thiedeweg 23b<br>
        Wann: 18 Uhr<br>
        Dresscode: Locker und gemütlich
    </p>

    <div class="divider"></div>

    <button class="btn-green" onclick="sendSMS()">Termin bestätigen</button>
    <button class="btn-grey" onclick="downloadMenu()">Speisekarte herunterladen</button>
</div>

</div>

<script>
function showPage(n) {
    document.getElementById("page1").classList.remove("active");
    document.getElementById("page2").classList.remove("active");
    document.getElementById("page" + n).classList.add("active");
}

function sendSMS() {
    window.location.href =
    "sms:+4915209767662?body=Ich%20best%C3%A4tige%20meinen%20Termin%20f%C3%BCr%20das%20Perfekte%20Dinner!";
}

function downloadMenu() {
    window.location.href = "Speisekarte.pdf";
}
</script>

</body>
</html>
