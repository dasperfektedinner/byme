<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Terminvorschlag</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&family=Dancing+Script:wght@500&display=swap" rel="stylesheet">

<style>
/* --- BODY + HINTERGRUND --- */
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: 'Lato', Arial, sans-serif;
    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    /* Blauschwarzer, verschwommener abstrakter Hintergrund */
    background: radial-gradient(circle at center, #0a0f1b 0%, #0f1a2e 100%);
}

body::before {
    content: '';
    position: absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1470&q=80') no-repeat center center;
    background-size: cover;
    filter: blur(12px) brightness(0.35);
    z-index: -1;
}

/* --- CONTAINER MIT SPOTLIGHT --- */
.container {
    background: rgba(10,15,30,0.65);
    backdrop-filter: blur(8px);
    padding: 50px 55px;
    border-radius: 25px;
    text-align: center; 
    box-shadow: 0 30px 70px rgba(0,0,0,0.7);
    max-width: 520px;
    width: 90%;
    position: relative;
    z-index: 1;
}

/* --- LOGO MIT PULS --- */
.logo {
    width: 120px;
    display: block;
    margin: 0 auto 25px auto;
    animation: pulse 2.5s infinite alternate;
}

@keyframes pulse {
    0% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(255,255,255,0.3)); }
    50% { transform: scale(1.05); filter: drop-shadow(0 0 15px rgba(255,255,255,0.5)); }
    100% { transform: scale(1.02); filter: drop-shadow(0 0 8px rgba(255,255,255,0.4)); }
}

/* --- ÜBERSCHRIFT --- */
h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.2em; 
    margin-bottom: 25px;
    letter-spacing: 1px;
    font-weight: 700;
    text-align: center; 
}

/* --- EINLADUNGSTEXT --- */
.invite-text {
    font-family: 'Dancing Script', cursive;
    font-size: 1.4em;
    margin: 12px 0;
    line-height: 1.5;
}

/* --- TERMIN DATEN --- */
.termin-daten {
    font-family: 'Playfair Display', serif;
    font-size: 1.15em;
    margin: 8px 0;
    line-height: 1.5;
}

/* --- ABGRENZUNGSLINIEN --- */
.divider {
    height: 1px;
    background: rgba(255,255,255,0.25);
    margin: 20px 0;
    border-radius: 1px;
}

/* --- BUTTONS --- */
.btn {
    margin-top: 20px;
    padding: 14px 30px;
    font-size: 1em;
    font-weight: 600;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    background: linear-gradient(180deg, #ffffff, #dddddd);
    color: #000000;
    transition: all 0.3s ease;
    text-decoration: none;
    display: inline-block;
    min-width: 230px;
}

.btn:hover {
    background: #ffffff;
    transform: scale(1.05);
}

.green {
    background: linear-gradient(180deg, #4caf50, #2e7d32);
    color: white;
}

.green:hover {
    background: #43a047;
}

/* --- ZURÜCK BUTTON --- */
.back-btn {
    position: absolute;
    top: 10px;
    left: 10px;
    font-family: 'Playfair Display', serif;
    font-size: 1em;
    color: #ffffff;
    text-decoration: underline;
    cursor: pointer;
    transition: color 0.3s ease;
}

.back-btn:hover {
    color: #ddd;
}

/* --- SEITEN + ANIMATION --- */
.page {
    opacity: 0;
    transform: scale(0.95) rotate(-1deg) translateY(20px);
    transition: all 0.7s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    display: none;
}

.page.active {
    display: block;
    opacity: 1;
    transform: scale(1) rotate(0deg) translateY(0);
}
</style>
</head>

<body>

<div class="container">

    <!-- SEITE 1 -->
    <div class="page active" id="page1">
        <img src="logo.png" alt="Koch Logo" class="logo">
        <h1>Terminvorschlag</h1>
        <button class="btn green" onclick="showDetails()">Anzeigen</button>
    </div>

    <!-- SEITE 2 -->
    <div class="page" id="page2">
        <img src="logo.png" alt="Koch Logo" class="logo">

        <p class="invite-text">Hiermit lade ich dich herzlich zu meinem „Perfekten Dinner“ ein.</p>

        <div class="divider"></div>

        <p class="termin-daten">Am: 21.02.2026</p>
        <p class="termin-daten">Wo: Thiedeweg 23b</p>
        <p class="termin-daten">Wann: 18 Uhr</p>
        <p class="termin-daten">Dresscode: Locker und gemütlich</p>

        <div class="divider"></div>

        <a class="btn green"
           href="sms:+4915209767662?body=Ich%20nehme%20am%20Perfekten%20Dinner%20teil!">
            Termin bestätigen
        </a>

        <a class="btn" href="Speisekarte.pdf" download>
            Speisekarte herunterladen
        </a>

        <div class="back-btn" onclick="goBack()">Zurück</div>

    </div>

</div>

<script>
function showDetails() {
    const p1 = document.getElementById("page1");
    const p2 = document.getElementById("page2");

    p2.style.display = "block";
    setTimeout(() => {
        p1.classList.remove("active");
        p2.classList.add("active");
    }, 50);

    setTimeout(() => p1.style.display = "none", 800);
}

function goBack() {
    const p1 = document.getElementById("page1");
    const p2 = document.getElementById("page2");

    p1.style.display = "block";
    setTimeout(() => {
        p2.classList.remove("active");
        p1.classList.add("active");
    }, 50);

    setTimeout(() => p2.style.display = "none", 800);
}
</script>

</body>
</html>
