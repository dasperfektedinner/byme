<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfektes Dinner</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden; /* kein Scrollen */
    font-family: Arial, sans-serif;
    background: url("background.jpg") no-repeat center center/cover;
    color: white;
}

/* Overlay für halbtransparenten Effekt */
.overlay {
    background: rgba(0,0,0,0.45);
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Seiten */
.page {
    display: none; /* Standard: unsichtbar */
    width: 90%;
    max-width: 420px;
    height: 100%;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    align-items: center;
}

/* Seite sichtbar */
.page.active {
    display: flex;
}

/* Logo */
.logo {
    width: 180px;
    animation: pulse 3s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }
    100% { transform: scale(1); }
}

/* Überschrift */
h1 {
    font-size: 32px;
}

/* Schnörkelschrift */
.fancy {
    font-family: "Segoe Script","Comic Sans MS",cursive;
    font-size: 22px;
}

/* Text */
p {
    font-size: 18px;
    line-height: 1.5;
}

/* Trennlinien */
.divider {
    width: 80%;
    height: 1px;
    background: white;
}

/* Buttons */
button {
    width: 85%;
    max-width: 300px;
    padding: 16px;
    border-radius: 25px;
    border: none;
    font-size: 18px;
    cursor: pointer;
    margin: 8px 0;
}

.btn-grey {
    background: #bcbcbc;
    color: black;
}

.btn-green {
    background: #1f6b3a;
    color: white;
}

/* Zurück-Button */
.back {
    position: absolute;
    top: 15px;
    left: 15px;
    font-size: 16px;
    text-decoration: underline;
    cursor: pointer;
}
</style>
</head>

<body>
<div class="overlay">

<!-- SEITE 1 -->
<div class="page active" id="page1">
    <img src="logo.png" class="logo">
    <h1>Terminvorschlag</h1>
    <button class="btn-grey" onclick="showPage(2)">Anzeigen</button>
</div>

<!-- SEITE 2 -->
<div class="page" id="page2">
    <div class="back" onclick="showPage(1)">Zurück</div>

    <img src="logo.png" class="logo">

    <div class="fancy">
        Hiermit lade ich dich herzlich zu meinem<br>
        „Perfekten Dinner“ ein.
    </div>

    <div class="divider"></div>

    <p>
        Am: 21.02.2026<br>
        Wo: Thiedeweg 23b<br>
        Wann: 18 Uhr<br>
        Dresscode: Locker und gemütlich
    </p>

    <div class="divider"></div>

    <button class="btn-green" onclick="sendSMS()">Termin bestätigen</button>
    <button class="btn-grey" onclick="downloadMenu()">Speisekarte herunterladen</button>
</div>

</div>

<script>
// Funktion zum Wechseln zwischen den Seiten
function showPage(n){
    const page1 = document.getElementById("page1");
    const page2 = document.getElementById("page2");

    if(n === 1){
        page1.classList.add("active");
        page2.classList.remove("active");
    } else {
        page1.classList.remove("active");
        page2.classList.add("active");
    }
}

// SMS versenden
function sendSMS(){
    window.location.href = "sms:+4915209767662?body=Ich%20best%C3%A4tige%20meinen%20Termin%20f%C3%BCr%20das%20Perfekte%20Dinner!";
}

// PDF herunterladen
function downloadMenu(){
    window.location.href="Speisekarte.pdf";
}
</script>

</body>
</html>
